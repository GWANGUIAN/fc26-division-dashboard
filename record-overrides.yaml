# 자동 전적 인식이 실패했거나 잘못된 경우 수동으로 통산 전적(W-D-L)을 지정합니다.
# soopId로 스트리머를 찾고, 그 스트리머의 "현재 디비전"이 division과 정확히 일치할 때만 적용됩니다.
# (디비전이 바뀌면 오래된 값이 실수로 남아 적용되는 걸 막기 위한 안전장치입니다.
#  승급/강등하면 이 항목은 더 이상 적용되지 않으니, 필요하면 새 division으로 다시 추가하세요.)
#
# 예:
# overrides:
#   - soopId: villlo
#     division: 5
#     record: { wins: 10, draws: 2, losses: 3 }

