context: |
  현재 우왁굳이라는 스트리머가 잔디동(FC 게임 동아리) 인원을 모집하고 있습니다. 아래가 그 모집 글입니다.

  [신청 조건]
  SOOP 여성 버츄얼

  [모집 인원]
  20~22명

  - 앞으로 나올 FC 27 컨텐츠 (버축대3 포함) 를 즐기기 위해 미리 준비하며 즐기는 동아리
  - 1군 11명 2군 11명 으로 1,2군을 나눠서 운영하는 최초의 동아리 시스템
  - 1:1 토너먼트와 승강전을 통해 동아리원들의 티어를 배정하고 동아리 1군 승격을 목표로 활동
  - 동아리 내부 토너먼트 혹은 11:11 내전을 통해 FC를 극한으로 재미있게 즐길 수 있다.
  - FC를 열심히 훈련하고 싶은 사람들은 FC 경력 28년 차인 우왁굳에게 팁을 빠르게 전수 받아 실력이 빠르게 상승 가능합니다.
  - VR챗 잔디동아리 부실 제작 예정 + VR챗 잔디동 컨텐츠 제작 예정
  - 버축대 3 확정 참가권

  [잔디동 선발 일정]
  0. 8월 12일 ~ 8월 26일 까지 2주간 'FC26 시즌 디비전' (솔로 랭겜) 올려보기
  1. 8월 26일날 잔디동 1차 합격자 발표
  2. 이후 잔디동 입단 테스트 혹은 대회를 통해 잔디동 최종 멤버 선발 예정

  [8월 20일 추가 공지]
  - 8월 26일 1차 합격자 발표 예정이며, 커트라인은 디비전 6부~7부로 정해질 예정입니다.
  - 다만 아직 9부에도 못 간 지원자가 대다수라 합격 인원이 축소될 수 있습니다.
  - 7부 지원자는 디비전 랭크 외에도 기존에 공지된 아래 요건들을 함께 평가받습니다:
    1. 1:1 디비전 랭크 (몇 부 리거인지)
    2. 1:1 직접 평가 (저격러를 많이 만나 억울한 경우를 막기 위한 직접 평가)
    3. 11대 11 플레이 평가 (희망 포지션의 11:11 플레이 영상을 종합 참고)
    4. 열정 평가 (방송에서 잔디를 얼마나 공부하고 연습했는지)
    5. 왁덜식 평가 (게임 외적인 부분을 포함한 종합 평가)
  - 1차 합격 이후 11대 11 평가전이 진행될 예정이며, 포지션별(센터백·풀백·수비형 미드필더·중앙 미드필더·윙포워드·스트라이커) 평가 기준 교본 영상도 새로 촬영되었습니다.
  - 저격당해 피해를 봤다고 생각되는 지원자는 개별적으로 1:1 요청이 가능합니다.
  - AI 연습은 세미프로~프로 단계까지만 추천되며, 월드클래스부터는 AI가 사용자 움직임을 예측해버려 오히려 실력이 줄고 뒤로 돌리기만 하는 습관이 생길 수 있어 지양하는 게 좋다고 합니다.
